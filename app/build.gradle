plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.nuvio.redirector'
    compileSdk 37

    defaultConfig {
        applicationId 'com.codex.nuvio.redirector'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
